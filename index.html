<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Diwali Wishes</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@500&display=swap" rel="stylesheet">
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  height: 100%;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #ff6f61, #ffb347, #ff6f61, #ffb347);
  background-size: 400% 400%;
  animation: gradientBG 20s ease infinite;
}

@keyframes gradientBG {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}

h1 {
  font-family: 'Pacifico', cursive;
  font-size: 3em;
  text-align: center;
  margin-top: 40px;
  animation: colorText 5s linear infinite;
  text-shadow: 2px 2px 15px #000;
  position: relative;
  z-index: 2;
}

@keyframes colorText {
  0% {color:#ff4f5a;}
  25% {color:#ffb347;}
  50% {color:#ffdf00;}
  75% {color:#6fffe9;}
  100% {color:#ff4f5a;}
}

#wish {
  font-size: 2em;
  color: #fff;
  text-align: center;
  margin-bottom: 30px;
  text-shadow: 2px 2px 10px #000;
  position: relative;
  z-index: 2;
}

#inputContainer {
  text-align: center;
  z-index: 2;
  position: relative;
}

input, button {
  padding: 12px 20px;
  margin: 10px 5px;
  font-size: 1em;
  border: none;
  border-radius: 25px;
  outline: none;
}

input {
  width: 220px;
  text-align: center;
}

button {
  background: linear-gradient(45deg, #fddb92, #ff6f61);
  color: white;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
}

canvas {
  position: absolute;
  top:0;
  left:0;
  z-index:1;
}
.diya {
  position: absolute;
  width: 40px;
  height: 60px;
  background: radial-gradient(circle at 50% 20%, #ffdf00 0%, #ff6b00 80%);
  border-radius: 50% 50% 50% 50%;
  bottom: 10px;
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-20px); }
}
</style>
</head>
<body>

<h1>🎆 Diwali Ki Hardik Shubhkamnayein 🎆</h1>
<p id="wish">From: Someone</p>

<div id="inputContainer">
  <p style="color:white; font-size:1.2em;">Apna naam daalein aur apna link share karein:</p>
  <input type="text" id="myName" placeholder="Apna naam">
  <button id="shareBtn">🎉 Share Wishes 🎉</button>
</div>

<canvas id="fireworks"></canvas>

<script>
  // Show sender name from URL
  const urlParams = new URLSearchParams(window.location.search);
  const sender = urlParams.get('name') || "Someone";
  document.getElementById('wish').innerText = sender + " ki taraf se";

  // Share logic
  const shareBtn = document.getElementById('shareBtn');
  shareBtn.addEventListener('click', async () => {
    const newName = document.getElementById('myName').value.trim() || "Someone";
    const newLink = window.location.origin + window.location.pathname + "?name=" + encodeURIComponent(newName);

    if (navigator.share) {
      await navigator.share({
        title: "Happy Diwali Wishes 🎆",
        text: `${newName} ki taraf se Diwali ki hardik shubhkamnayein 🎇✨`,
        url: newLink
      });
    } else {
      navigator.clipboard.writeText(newLink);
      alert("Share not supported on this device. Link copied:\n" + newLink);
    }
  });

  // Fireworks and Diyas (same as before)
  const canvas = document.getElementById('fireworks');
  const ctx = canvas.getContext('2d');
  let W = canvas.width = window.innerWidth;
  let H = canvas.height = window.innerHeight;

  window.addEventListener('resize', () => {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  });

  const fireworks = [];
  const particles = [];

  class Firework {
    constructor(x, y, targetX, targetY) {
      this.x = x;
      this.y = y;
      this.targetX = targetX;
      this.targetY = targetY;
      this.speed = 4 + Math.random()*3;
      this.angle = Math.atan2(targetY - y, targetX - x);
      this.distance = Math.hypot(targetX - x, targetY - y);
      this.traveled = 0;
      this.exploded = false;
      this.color = `hsl(${Math.random()*360}, 100%, 50%)`;
    }
    update() {
      const vx = Math.cos(this.angle) * this.speed;
      const vy = Math.sin(this.angle) * this.speed;
      this.x += vx;
      this.y += vy;
      this.traveled += Math.sqrt(vx*vx + vy*vy);
      if(this.traveled >= this.distance) this.explode();
    }
    explode() {
      if(this.exploded) return;
      this.exploded = true;
      for(let i=0;i<100;i++){
        particles.push(new Particle(this.x, this.y, this.color));
      }
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x,this.y,3,0,Math.PI*2);
      ctx.fillStyle = this.color;
      ctx.fill();
    }
  }

  class Particle {
    constructor(x,y,color){
      this.x = x;
      this.y = y;
      this.color = color;
      this.speed = Math.random()*6;
      this.angle = Math.random()*Math.PI*2;
      this.alpha = 1;
      this.decay = 0.015 + Math.random()*0.02;
    }
    update(){
      this.x += Math.cos(this.angle)*this.speed;
      this.y += Math.sin(this.angle)*this.speed;
      this.alpha -= this.decay;
    }
    draw(){
      ctx.save();
      ctx.globalAlpha = this.alpha;
      ctx.beginPath();
      ctx.arc(this.x,this.y,2,0,Math.PI*2);
      ctx.fillStyle = this.color;
      ctx.fill();
      ctx.restore();
    }
  }

  function animate(){
    requestAnimationFrame(animate);
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.fillRect(0,0,W,H);

    if(Math.random() < 0.1){
      const startX = Math.random()*W;
      const startY = H;
      const targetX = Math.random()*W;
      const targetY = Math.random()*H/2;
      fireworks.push(new Firework(startX,startY,targetX,targetY));
    }

    fireworks.forEach((f,i)=>{
      f.update();
      f.draw();
      if(f.exploded) fireworks.splice(i,1);
    });

    particles.forEach((p,i)=>{
      p.update();
      p.draw();
      if(p.alpha <= 0) particles.splice(i,1);
    });
  }

  animate();

  // Lightning effect
  setInterval(()=>{
    const flash = document.createElement('div');
    flash.style.position = 'absolute';
    flash.style.top = 0;
    flash.style.left = 0;
    flash.style.width = '100%';
    flash.style.height = '100%';
    flash.style.background = 'rgba(255,255,255,0.2)';
    flash.style.zIndex = 0;
    document.body.appendChild(flash);
    setTimeout(()=>flash.remove(), 80);
  }, 1000);

  // Floating Diyas
  for(let i=0; i<10; i++){
    const diya = document.createElement('div');
    diya.classList.add('diya');
    diya.style.left = Math.random()*window.innerWidth + 'px';
    diya.style.animationDelay = (Math.random()*4)+'s';
    document.body.appendChild(diya);
  }
</script>
</body>
</html>
