<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diwali Wishes 🎇</title>
<style>
body, html {
  margin: 0;
  padding: 0;
  overflow: hidden;
  height: 100%;
  font-family: 'Poppins', sans-serif;
}

/* Gradient animated background */
#background {
  position: fixed;
  width: 100%;
  height: 100%;
  background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
  background-size: 400% 400%;
  animation: gradientBG 12s ease infinite;
  z-index: -2;
}

@keyframes gradientBG {
  0% { background-position:0% 50%; }
  50% { background-position:100% 50%; }
  100% { background-position:0% 50%; }
}

/* Fireworks canvas */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
}

/* Heading text */
h1 {
  font-family: 'Pacifico', cursive;
  font-size: 3em;
  text-align: center;
  color: #fff;
  text-shadow: 0 0 15px #ff0, 0 0 30px #ff0080, 0 0 45px #ff0;
  margin-top: 50px;
  animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #ff0080, 0 0 20px #ff0080; }
  to { text-shadow: 0 0 20px #ffff00, 0 0 40px #ff0080; }
}

#wish {
  text-align: center;
  color: white;
  font-size: 1.8em;
  margin-top: 10px;
  text-shadow: 0 0 10px #000;
}

#inputContainer {
  text-align: center;
  margin-top: 40px;
}

input, button {
  padding: 12px 20px;
  margin: 10px;
  font-size: 1em;
  border-radius: 25px;
  border: none;
  outline: none;
}

input {
  width: 220px;
  text-align: center;
}

button {
  background: linear-gradient(45deg, #ff6f61, #fddb92);
  color: white;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
}

#shareBtn {
  background-color: #25D366;
  color: white;
  font-weight: bold;
}

/* Floating sweets and gifts */
.floating {
  position: absolute;
  width: 70px;
  height: 70px;
  animation: float 10s linear infinite, rotate 8s linear infinite;
}

@keyframes float {
  0% { transform: translateY(100vh) rotate(0deg) scale(1); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translateY(-10vh) rotate(360deg) scale(1); opacity: 0; }
}

@keyframes rotate {
  0% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(180deg) scale(1.1); }
  100% { transform: rotate(360deg) scale(1); }
}
</style>
</head>
<body>

<div id="background"></div>
<canvas id="fireworks"></canvas>

<h1>🎆 Happy Diwali 🎆</h1>
<p id="wish">From: ashish</p>

<div id="inputContainer">
  <input type="text" id="myName" placeholder="Apna naam likhiye">
  <button id="shareBtn">🎉 Share on WhatsApp</button>
</div>

<!-- Floating sweets and gifts -->
<img src="https://imgs.search.brave.com/KyxqhPnqIPNBtjbs6RZw-RPfUJ9c-n401ohhSNiWgoY/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9tZWRp/YS5nZXR0eWltYWdl/cy5jb20vaWQvMTA1/OTE3MzI3Ni9waG90/by9tdW1iYWktaW5k/aWEtbm92ZW1iZXIt/Ny15b3VuZ3N0ZXIt/Y2VsZWJyYXRlcy1k/aXdhbGktd2l0aC1z/cGFya2xpbmctY3Jh/Y2tlcnMtYXQtcHJh/YmhhZGV2aS1vbi5q/cGc_cz02MTJ4NjEy/Jnc9MCZrPTIwJmM9/ZUJSRGpDcnctUWtU/SzhpblFIOXVzSlg4/Q3R3ZW0wVS1pVHpR/TW1HeVJ3OD0" class="floating" style="left:5%; animation-delay:1s;">
<img src="https://imgs.search.brave.com/amTlhvn_k4jwKNDN6VjlVsYDgKgvwNPXlXdcDg-vgiU/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pLnBp/bmltZy5jb20vb3Jp/Z2luYWxzLzYyLzI3/LzdhLzYyMjc3YThl/NTc1Mjc0ZDM3MjNi/ODQzOTQ3YjBiYWU3/LmpwZw" class="floating" style="left:20%; animation-delay:3s;">
<img src="https://imgs.search.brave.com/hxiB6MX6595xilvzsMD_n1jxHIdkG6WwKXY8E8mjv08/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pbWcu/ZnJlZXBpay5jb20v/ZnJlZS12ZWN0b3Iv/ZGl3YWxpLWRpeWEt/b2lsLWxhbXAtaG9s/aWRheS1kZXNpZ24t/dHJhZGl0aW9uYWwt/aW5kaWFuLWZlc3Rp/dmFsLWxpZ2h0cy0z/ZC1yZWFsaXN0aWMt/c3R5bGUtd2l0aC1i/bHVyLWVmZmVjdC1y/YW5nb2xpLXB1cnBs/ZS1iYWNrZ3JvdW5k/LXZlY3Rvci1pbGx1/c3RyYXRpb25fMTcz/MjA3LTIwMjEuanBn/P3NlbXQ9YWlzX2h5/YnJpZCZ3PTc0MCZx/PTgw" class="floating" style="left:40%; animation-delay:2s;">
<img src="https://mirchi.com/os/cdn/content/images/assorted%2018%20piece%20pure%20ghee%20sweets%20diwali%20gift%20box%20mirchi%20dot%20com_medium_4181506.webp" class="floating" style="left:60%; animation-delay:4s;">
<img src="https://imgs.search.brave.com/i0Z6oK521E7wMc2aosOgLcjP6JeUXusgMxTDhj3MuGs/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly90My5m/dGNkbi5uZXQvanBn/LzA2LzM1LzgxLzk0/LzM2MF9GXzYzNTgx/OTQ0OV96SlJWdWpw/Q2Zxajd1Zzh1V25S/Vzg4MXZ3ejJIZTZm/NC5qcGc" class="floating" style="left:80%; animation-delay:1.5s;">

<script>
  // Personalized name logic
  const urlParams = new URLSearchParams(window.location.search);
  const name = urlParams.get('name') || "ashish";
  document.getElementById('wish').innerText = `${name} ki taraf se Diwali ki hardik shubhkamnayein 🎇`;
  document.getElementById('myName').value = name;

  // WhatsApp share button
  document.getElementById('shareBtn').addEventListener('click', () => {
    const myName = document.getElementById('myName').value.trim() || "Someone";
    const newLink = window.location.origin + window.location.pathname + "?name=" + encodeURIComponent(myName);
    const text = `${myName} ki taraf se Diwali ki hardik shubhkamnayein! 🪔✨\n${newLink}`;
    window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
  });

  // Fireworks animation
  const canvas = document.getElementById('fireworks');
  const ctx = canvas.getContext('2d');
  let W = canvas.width = window.innerWidth;
  let H = canvas.height = window.innerHeight;

  window.addEventListener('resize', () => {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  });

  const fireworks = [], particles = [];

  class Firework {
    constructor(x, y, targetX, targetY) {
      this.x = x; this.y = y;
      this.targetX = targetX; this.targetY = targetY;
      this.speed = 3 + Math.random() * 3;
      this.angle = Math.atan2(targetY - y, targetX - x);
      this.distance = Math.hypot(targetX - x, targetY - y);
      this.traveled = 0;
      this.exploded = false;
      this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
    }
    update() {
      const vx = Math.cos(this.angle) * this.speed;
      const vy = Math.sin(this.angle) * this.speed;
      this.x += vx;
      this.y += vy;
      this.traveled += Math.sqrt(vx*vx + vy*vy);
      if (this.traveled >= this.distance) this.explode();
    }
    explode() {
      if(this.exploded) return;
      this.exploded = true;
      for(let i=0;i<80;i++) particles.push(new Particle(this.x, this.y, this.color));
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, 3, 0, Math.PI*2);
      ctx.fillStyle = this.color;
      ctx.fill();
    }
  }

  class Particle {
    constructor(x,y,color){
      this.x = x; this.y = y; this.color = color;
      this.speed = Math.random() * 5;
      this.angle = Math.random() * Math.PI * 2;
      this.alpha = 1;
      this.decay = 0.01 + Math.random()*0.02;
    }
    update(){
      this.x += Math.cos(this.angle) * this.speed;
      this.y += Math.sin(this.angle) * this.speed;
      this.alpha -= this.decay;
    }
    draw(){
      ctx.save();
      ctx.globalAlpha = this.alpha;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 2, 0, Math.PI*2);
      ctx.fillStyle = this.color;
      ctx.fill();
      ctx.restore();
    }
  }

  function animate(){
    requestAnimationFrame(animate);
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.fillRect(0,0,W,H);

    if(Math.random() < 0.1){
      const startX = Math.random()*W;
      const targetX = Math.random()*W;
      const targetY = Math.random()*H/2;
      fireworks.push(new Firework(startX, H, targetX, targetY));
    }

    fireworks.forEach((f,i)=>{
      f.update();
      f.draw();
      if(f.exploded) fireworks.splice(i,1);
    });

    particles.forEach((p,i)=>{
      p.update();
      p.draw();
      if(p.alpha <= 0) particles.splice(i,1);
    });
  }

  animate();
</script>

</body>
</html>
